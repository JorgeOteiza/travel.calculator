services:
  - type: web
    name: travelcalculator-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && flask db upgrade
    startCommand: gunicorn "app:create_app()"
    healthCheckPath: /api/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      # Base de datos: PostgreSQL gratuito y persistente en Neon (neon.com),
      # no el Postgres free de Render (expira a los 30 días). Pega aquí la
      # cadena de conexión del proyecto Neon manualmente en el dashboard.
      - key: SQLALCHEMY_DATABASE_URI
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      # Dominio del frontend en Cloudflare Pages (ej. https://travelcalculator.pages.dev)
      - key: CORS_ORIGINS
        sync: false
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false
      - key: OPENWEATHERMAP_API_KEY
        sync: false
